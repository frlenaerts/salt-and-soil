# Salt & Soil — config.example.toml
# Copy this to config/config.toml and adjust to your environment.

[app]
role      = "orchestrator"    # "orchestrator" or "agent"
node_name = "orchestrator-01"
data_dir  = "./data"
log_level = "INFO"            # DEBUG | INFO | WARNING | ERROR

# Web server
[server]
host = "0.0.0.0"
port = 8080

# Auth
# On an agent node: the key that incoming requests must carry in X-Api-Key.
# On an orchestrator node: this section is unused — set the per-agent key
# in [[agents]] api_key instead. Same string on both sides.
[auth]
api_key = ""

# NFS mount defaults — applied to every (host, share) mount on this node.
# Each unique (local_host, local_share) across all [[sources]] becomes one
# mount under {mount_root_local}/{slug(host)}_{slug(share)}.
[mount_defaults]
type              = "nfs"
nfs_version       = 3
nfs_options       = "soft,timeo=30,retrans=3"
mount_retry_delay = 10                       # seconds to wait before retrying a failed mount (NAS wake-up)
mount_root_local  = "/mnt/salt-and-soil"     # parent dir for local mounts on this node
mount_root_remote = "/mnt/salt-and-soil"     # parent dir for mounts on the agent node (same convention)

# What gets synchronised — generic knobs that apply to every source
[sync]
scan_on_startup   = false
auto_resume       = true
compare_mode      = "size_mtime"  # "size_mtime" | "checksum"
max_parallel_jobs = 2
exclude_file      = "./config/excludes.list"   # gitignore-style patterns applied to scan + rsync

# Local state storage
[state]
backend      = "json"
state_file   = "./data/state/state.json"
snapshot_dir = "./data/state/snapshots"

# Agent connections (orchestrator only).
# Per-source mount details (share/path) live in [[sources]], not here.
[[agents]]
name         = "agent-01"
host         = "10.0.0.2"            # IP of the agent node (API calls)
port         = 8080                  # must match agent's [server] port
api_key      = ""                    # must match the agent's [auth] api_key
ssh_host     = "10.0.0.2"            # IP for rsync over SSH
ssh_user     = "root"
ssh_key_file = "/root/.ssh/saltsoil_key"

# Sync targets. Each [[sources]] entry is one alias/group in the UI and one
# logical pairing between an orchestrator share and an agent share.
# Multiple sources with the same (local_host, local_share) share one mount.

[[sources]]
alias        = "videos"
sort         = 10                    # lower sort = higher in the UI list (use steps of 10)
agent        = "agent-01"            # must match an [[agents]].name
local_host   = "192.168.1.100"       # NFS host on this (orchestrator) NAS
local_share  = "/volume1"            # NFS export on this NAS
local_path   = "videos"              # subdir under the share; "" = scan the share root
remote_share = "/volume1"            # NFS export on the agent's NAS (its config knows the host)
remote_path  = "videos"

# Multiple sources are supported. Two sources with the same local_share reuse
# the same mount; a source with a different local_share gets its own mount.
#
# [[sources]]
# alias        = "music"
# sort         = 20
# agent        = "agent-01"
# local_host   = "192.168.1.100"
# local_share  = "/volume2"
# local_path   = ""                  # albums directly at the share root
# remote_share = "/volume2"
# remote_path  = ""
